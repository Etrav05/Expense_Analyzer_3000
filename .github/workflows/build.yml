name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r requirements.txt

      - name: Build exe
        run: pyinstaller ExpenseAnalyzer3000.spec

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseAnalyzer3000-Windows
          path: dist/ExpenseAnalyzer3000.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r requirements.txt

      - name: Build app
        run: pyinstaller --onefile --windowed GUI.py --name ExpenseAnalyzer3000

      - name: Zip the app
        run: zip -r ExpenseAnalyzer3000-Mac.zip dist/ExpenseAnalyzer3000.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseAnalyzer3000-Mac
          path: ExpenseAnalyzer3000-Mac.zip
