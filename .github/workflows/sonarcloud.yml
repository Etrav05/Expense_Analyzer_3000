name: SonarQube Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Sonar can tell new vs overall code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install matplotlib numpy pytest pytest-cov

      - name: Build (byte-compile all Python files)
        run: python -m compileall -q .

      - name: Run tests with coverage
        env:
          MPLBACKEND: Agg   # no display on the runner
        run: pytest --cov=. --cov-report=xml || [ $? -eq 5 ]

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
